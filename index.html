<!doctype html>
<html lang="is">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verkefnalisti</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Verkefnalisti</h1>
    </header>

    <main>
      <section>
        <h2>Verkefnalisti vikunnar</h2>
        <label for="vika">Vikan:</label>
        <input type="text" id="vika" placeholder="T.d. 2.–6. nóvember 2026" />
        <button type="button" id="hreinsaViku">Hreinsa</button>

        <div class="kassar">
          <div class="kassi">
            <h3>Heildarfjöldi</h3>
            <p id="heild">0</p>
          </div>

          <div class="kassi">
            <h3>Lokið</h3>
            <p id="lokid">0</p>
          </div>

          <div class="kassi">
            <h3>Ólokið</h3>
            <p id="olokid">0</p>
          </div>
        </div>
      </section>

      <section>
        <h2>Bæta við verkefni</h2>
        <form id="verkefnaForm">
          <label for="verkefni">Verkefni</label>
          <input type="text" id="verkefni" placeholder="Skrifaðu verkefni..." required />
          <button type="submit">Bæta við</button>
        </form>
      </section>

      <section>
        <h2>Verkefnin mín</h2>
        <div id="verkefnalisti"></div>
      </section>
      <button id="endurstilla">Endurstilla síðu</button>
    </main>

    <footer>
      © 2026 Harpa Hermannsdóttir
      <p>Unnið með HTML, CSS og JavaScript.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
